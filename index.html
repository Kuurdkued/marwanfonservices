
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marwan Fon Services | Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tech: {
                            blue: '#020617',
                            cyan: '#22d3ee'
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            transition: background-color 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Fixed Theme Backgrounds */
        html.dark body {
            background-color: #020617;
            color: #f8fafc;
        }

        html.light body {
            background-color: #f1f5f9;
            color: #0f172a;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.05;
            pointer-events: none;
            z-index: 100;
        }

        /* Glassmorphism Refinement */
        .glass {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(24px);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .light .glass {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
        }

        /* Ambient Lights */
        .ambient-light {
            position: fixed;
            width: 50vw;
            height: 50vh;
            border-radius: 100%;
            filter: blur(150px);
            pointer-events: none;
            z-index: -1;
            opacity: 0.15;
            transition: all 1s ease;
        }
        .dark .ambient-light { opacity: 0.15; }
        .light .ambient-light { opacity: 0.05; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(34, 211, 238, 0.3);
            border-radius: 10px;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.15);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "framer-motion": "https://esm.sh/framer-motion@^12.23.26",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body class="dark overflow-x-hidden">
    <div class="noise-overlay"></div>
    <div class="ambient-light top-[-10%] left-[-10%] bg-blue-500 animate-pulse-slow"></div>
    <div class="ambient-light bottom-[-10%] right-[-10%] bg-cyan-500 animate-pulse-slow" style="animation-delay: 2s"></div>
    <div id="root"></div>
</body>
</html>
